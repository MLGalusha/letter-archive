name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Backend + Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PORT: 3002
      VITE_API_URL: http://localhost:3002
      E2E_BASE_URL: http://localhost:5174
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npm run drizzle:migrate

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: nohup npm run dev > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3002/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat /tmp/backend.log || true
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:5174 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready"
          cat /tmp/frontend.log || true
          exit 1

      - name: Warmup frontend
        run: |
          # Pre-load admin pages so Vite compiles all modules before tests start
          curl -sf http://localhost:5174/admin-login >/dev/null || true
          curl -sf http://localhost:5174/admin >/dev/null || true
          sleep 2

      - name: Run smoke e2e
        working-directory: e2e
        run: npx playwright test tests/admin-auth.spec.ts tests/navigation.spec.ts --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Dump frontend logs on failure
        if: failure()
        run: cat /tmp/frontend.log || true

  e2e-full:
    name: E2E Full Suite
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PORT: 3002
      VITE_API_URL: http://localhost:3002
      E2E_BASE_URL: http://localhost:5174
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npm run drizzle:migrate

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: nohup npm run dev > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3002/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat /tmp/backend.log || true
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:5174 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready"
          cat /tmp/frontend.log || true
          exit 1

      - name: Warmup frontend
        run: |
          curl -sf http://localhost:5174/admin-login >/dev/null || true
          curl -sf http://localhost:5174/admin >/dev/null || true
          sleep 2

      - name: Run full e2e
        working-directory: e2e
        run: npx playwright test --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Dump frontend logs on failure
        if: failure()
        run: cat /tmp/frontend.log || true

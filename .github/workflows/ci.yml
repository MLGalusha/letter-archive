name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Superseded PR runs can stop; production/main runs must finish independently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-scope:
    name: Select browser coverage
    runs-on: ubuntu-latest
    outputs:
      run_browser: ${{ steps.scope.outputs.run_browser }}
    steps:
      - name: Checkout comparison revisions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # PR merge revision and its parents; unavailable history runs full coverage.
          fetch-depth: 2
      - name: Verify selection safeguards
        run: node --test scripts/select-browser-checks.test.mjs
      - name: Select browser coverage
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/select-browser-checks.mjs

  quality:
    name: Tests, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify admin wire contracts
        run: node scripts/sync-admin-wire-contracts.mjs --check

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Audit backend production dependencies
        working-directory: backend
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend production dependencies
        working-directory: frontend
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: PostgreSQL processing lease regressions
        timeout-minutes: 10
        working-directory: backend
        run: npm run db:test-migrations && npm run test:processing-leases:postgres

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend lint regression check
        working-directory: frontend
        run: npm run lint:ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  e2e-mocked-tests:
    name: Mocked browser checks (${{ matrix.suite }})
    needs: browser-scope
    if: needs.browser-scope.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    # Keep one worker per mocked shard; distribute cases across isolated runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shard-1
            config: playwright.mocked.config.ts
            shard: 1/4
          - suite: shard-2
            config: playwright.mocked.config.ts
            shard: 2/4
          - suite: shard-3
            config: playwright.mocked.config.ts
            shard: 3/4
          - suite: shard-4
            config: playwright.mocked.config.ts
            shard: 4/4
          - suite: mobile
            config: playwright.mobile-layout.config.ts
            shard: 1/1
    env:
      CI: true
      E2E_MOCKED_BASE_URL: http://127.0.0.1:4174
      E2E_API_BASE_URL: http://localhost:3002
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browser
        timeout-minutes: 8
        working-directory: e2e
        run: |
          npx playwright install --with-deps --only-shell chromium
          npx playwright install --with-deps webkit

      - name: Verify benchmark metadata
        if: matrix.suite == 'mobile'
        working-directory: e2e
        run: npm run test:benchmark

      - name: Run browser checks
        working-directory: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: >-
          npx playwright test
          --config=${{ matrix.config }}
          --shard=${{ matrix.shard }}
          --reporter=line,html,json

      - name: Upload mocked Playwright report
        id: playwright_mocked_report
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-mocked-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results/results.json
          if-no-files-found: ignore

      - name: Report diagnostic upload failure
        if: always() && steps.playwright_mocked_report.outcome == 'failure'
        run: echo "::warning::Diagnostic upload failed; test results remain in this job's logs."

  # Preserve the branch-protection context and fail closed on any matrix failure,
  # cancellation, or unexpected skip. Only a successful scope decision may omit it.
  e2e-mocked:
    name: E2E Mocked Suite
    runs-on: ubuntu-latest
    needs: [browser-scope, e2e-mocked-tests]
    if: always()
    steps:
      - name: Require browser success or an explicit safe exclusion
        env:
          SCOPE_RESULT: ${{ needs.browser-scope.result }}
          RUN_BROWSER: ${{ needs.browser-scope.outputs.run_browser }}
          BROWSER_RESULT: ${{ needs.e2e-mocked-tests.result }}
        run: |
          echo "Browser matrix result: $BROWSER_RESULT"
          test "$SCOPE_RESULT" = success
          case "$RUN_BROWSER:$BROWSER_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Browser coverage did not satisfy the selection decision" >&2; exit 1 ;;
          esac

  e2e-webkit-scroll:
    name: WebKit Native Scrolling
    needs: browser-scope
    if: needs.browser-scope.outputs.run_browser == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install WebKit
        working-directory: e2e
        run: npx playwright install webkit
      - name: Verify native WebKit scrolling
        working-directory: e2e
        run: npx playwright test --config=playwright.webkit-scroll.config.ts
      - name: Upload WebKit scrolling report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-webkit-scroll-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PORT: 3002
      VITE_API_URL: http://localhost:3002
      E2E_BASE_URL: http://localhost:5174
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npm run drizzle:migrate

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browser
        timeout-minutes: 8
        working-directory: e2e
        run: npx playwright install --with-deps --only-shell chromium

      - name: Start backend
        working-directory: backend
        run: nohup npm run dev > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3002/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat /tmp/backend.log || true
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:5174 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready"
          cat /tmp/frontend.log || true
          exit 1

      - name: Warmup frontend
        run: |
          # Pre-load admin pages so Vite compiles all modules before tests start
          curl -sf http://localhost:5174/admin-login >/dev/null || true
          curl -sf http://localhost:5174/admin >/dev/null || true
          sleep 2

      - name: Run smoke e2e
        working-directory: e2e
        run: npx playwright test tests/admin-auth.spec.ts tests/navigation.spec.ts --workers=1

      - name: Upload Playwright report
        id: playwright_smoke_report
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Report diagnostic upload failure
        if: always() && steps.playwright_smoke_report.outcome == 'failure'
        run: echo "::warning::Diagnostic upload failed; test results remain in this job's logs."

      - name: Upload backend structured logs
        id: backend_structured_logs_smoke
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-structured-logs-smoke
          path: backend/logs
          if-no-files-found: ignore

      - name: Report diagnostic upload failure
        if: always() && steps.backend_structured_logs_smoke.outcome == 'failure'
        run: echo "::warning::Diagnostic upload failed; test results remain in this job's logs."

      - name: Dump backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Dump frontend logs on failure
        if: failure()
        run: cat /tmp/frontend.log || true

  e2e-full:
    name: E2E Full Suite
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      PORT: 3002
      VITE_API_URL: http://localhost:3002
      E2E_BASE_URL: http://localhost:5174
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npm run drizzle:migrate

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browser
        timeout-minutes: 8
        working-directory: e2e
        run: npx playwright install --with-deps --only-shell chromium

      - name: Start backend
        working-directory: backend
        run: nohup npm run dev > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3002/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat /tmp/backend.log || true
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:5174 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready"
          cat /tmp/frontend.log || true
          exit 1

      - name: Warmup frontend
        run: |
          curl -sf http://localhost:5174/admin-login >/dev/null || true
          curl -sf http://localhost:5174/admin >/dev/null || true
          sleep 2

      - name: Run full e2e
        working-directory: e2e
        run: npx playwright test --workers=1

      - name: Upload Playwright report
        id: playwright_full_report
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-full-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Report diagnostic upload failure
        if: always() && steps.playwright_full_report.outcome == 'failure'
        run: echo "::warning::Diagnostic upload failed; test results remain in this job's logs."

      - name: Upload backend structured logs
        id: backend_structured_logs_full
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-structured-logs-full
          path: backend/logs
          if-no-files-found: ignore

      - name: Report diagnostic upload failure
        if: always() && steps.backend_structured_logs_full.outcome == 'failure'
        run: echo "::warning::Diagnostic upload failed; test results remain in this job's logs."

      - name: Dump backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Dump frontend logs on failure
        if: failure()
        run: cat /tmp/frontend.log || true

  release:
    name: Production Release
    runs-on: ubuntu-latest
    needs:
      - quality
      - e2e-mocked
      - e2e-smoke
      - e2e-webkit-scroll
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.AUTOMATIC_RELEASES_ENABLED == 'true'
    concurrency:
      group: letter-archive-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine release scope
        id: scope
        env:
          HEAD_REVISION: ${{ github.sha }}
        run: |
          backend_revision="$(
            curl --connect-timeout 5 --max-time 15 -fsS \
              https://api.voicesthatremain.com/health \
              | jq -r '.releaseSha // empty'
          )" || backend_revision=unavailable
          frontend_revision="$(
            curl --connect-timeout 5 --max-time 15 -fsS \
              https://voicesthatremain.com/version.json \
              | jq -r '.releaseSha // empty'
          )" || frontend_revision=unavailable
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "$backend_revision" =~ $sha_pattern ]]; then
            backend_revision=unavailable
          fi
          if [[ ! "$frontend_revision" =~ $sha_pattern ]]; then
            frontend_revision=unavailable
          fi
          scope="$(
            bash deploy/cloudrun/select-release-scope.sh \
              "$backend_revision" "$frontend_revision" "$HEAD_REVISION"
          )"
          case "$scope" in
            none|stale|frontend|full) ;;
            *)
              echo "Unexpected release scope: $scope" >&2
              exit 1
              ;;
          esac
          {
            printf 'scope=%s\n' "$scope"
            printf 'backend_revision=%s\n' "$backend_revision"
            printf 'frontend_revision=%s\n' "$frontend_revision"
          } >> "$GITHUB_OUTPUT"
          printf 'Release scope: %s\n' "$scope"

      - name: Authenticate to Google Cloud
        if: >-
          steps.scope.outputs.scope != 'none'
          && steps.scope.outputs.scope != 'stale'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: letter-archive-485110
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: >-
          steps.scope.outputs.scope != 'none'
          && steps.scope.outputs.scope != 'stale'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Start exact-SHA Cloud Build release
        if: >-
          steps.scope.outputs.scope != 'none'
          && steps.scope.outputs.scope != 'stale'
        env:
          RELEASE_SCOPE: ${{ steps.scope.outputs.scope }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$RELEASE_SCOPE" == "frontend" ]]; then
            release_config=cloudbuild.frontend-release.yaml
          else
            release_config=cloudbuild.release.yaml
          fi

          gcloud builds submit \
            https://github.com/MLGalusha/letter-archive.git \
            --project=letter-archive-485110 \
            --region=us-east1 \
            --git-source-revision="$RELEASE_SHA" \
            --service-account=projects/letter-archive-485110/serviceAccounts/letter-archive-build@letter-archive-485110.iam.gserviceaccount.com \
            --config="$release_config" \
            --substitutions="_TAG=$RELEASE_SHA"

      - name: Record release summary
        if: always()
        env:
          RELEASE_SCOPE: ${{ steps.scope.outputs.scope }}
          RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_BACKEND_REVISION: ${{ steps.scope.outputs.backend_revision }}
          PREVIOUS_FRONTEND_REVISION: ${{ steps.scope.outputs.frontend_revision }}
        run: |
          {
            echo "### Production release"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Scope: \`${RELEASE_SCOPE:-unknown}\`"
            echo "- Previous backend: \`${PREVIOUS_BACKEND_REVISION:-unknown}\`"
            echo "- Previous frontend: \`${PREVIOUS_FRONTEND_REVISION:-unknown}\`"
            echo "- Project: \`letter-archive-485110\`"
          } >> "$GITHUB_STEP_SUMMARY"

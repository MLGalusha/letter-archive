# Safe frontend-only Cloud Build validation.
#
# A path-filtered trigger may still select this file when a larger main-branch
# commit includes frontend changes. Keep it build-only for the same reason as
# cloudbuild.yaml: source integration must never imply a production deployment.

substitutions:
  _DOMAIN: voicesthatremain.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -t
      - 'letter-archive-frontend-validation:${BUILD_ID}'
      - --build-arg
      - 'VITE_API_URL=https://api.${_DOMAIN}'
      - --build-arg
      - 'VITE_SITE_URL=https://${_DOMAIN}'
      - -f
      - frontend/Dockerfile
      - frontend
    waitFor: ['-']

timeout: 600s

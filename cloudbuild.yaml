# Safe push-to-main Cloud Build pipeline for Letter Archive.
#
# This trigger validates the production Docker build contexts only. It deliberately
# does not push images, run migrations, or replace Cloud Run services/jobs. The first
# deployment containing migrations 0054/0055 requires a controlled write-quiesced
# rollout through cloudbuild.deploy.yaml; a source merge is not a deployment signal.

substitutions:
  _DOMAIN: voicesthatremain.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -t
      - 'letter-archive-backend-validation:${BUILD_ID}'
      - -f
      - backend/Dockerfile
      - backend
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -t
      - 'letter-archive-frontend-validation:${BUILD_ID}'
      - --build-arg
      - 'VITE_API_URL=https://api.${_DOMAIN}'
      - --build-arg
      - 'VITE_SITE_URL=https://${_DOMAIN}'
      - -f
      - frontend/Dockerfile
      - frontend
    waitFor: ['-']

timeout: 1200s

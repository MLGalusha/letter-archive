# Cloud Build pipeline for Letter Archive
# Builds backend + frontend images, runs migrations, deploys to Cloud Run.
#
# Trigger: push to main branch (or manual)
# Required substitutions: _REGION, _CLOUD_SQL_INSTANCE, _ARCHIVE_BUCKET
#
# Usage:
#   gcloud builds submit \
#     --substitutions=_REGION=us-central1,_CLOUD_SQL_INSTANCE=letter-archive-db,_ARCHIVE_BUCKET=letter-archive-storage

substitutions:
  _REGION: us-central1
  _REPO: letter-archive
  _BACKEND_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend'
  _FRONTEND_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Step 1: Build backend image ──────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -t
      - '${_BACKEND_IMAGE}:${SHORT_SHA}'
      - -t
      - '${_BACKEND_IMAGE}:latest'
      - -f
      - backend/Dockerfile
      - backend
    waitFor: ['-']

  # ── Step 2: Build frontend image ─────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -t
      - '${_FRONTEND_IMAGE}:${SHORT_SHA}'
      - -t
      - '${_FRONTEND_IMAGE}:latest'
      - --build-arg
      - 'VITE_API_URL=https://api.${_DOMAIN}'
      - --build-arg
      - 'VITE_SITE_URL=https://${_DOMAIN}'
      - -f
      - frontend/Dockerfile
      - frontend
    waitFor: ['-']

  # ── Step 3: Push images (parallel after builds) ──────────
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args: ['push', '--all-tags', '${_BACKEND_IMAGE}']
    waitFor: ['build-backend']

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args: ['push', '--all-tags', '${_FRONTEND_IMAGE}']
    waitFor: ['build-frontend']

  # ── Step 4: Run database migrations ──────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - letter-archive-migrate
      - --region=${_REGION}
      - --update-containers
      - --image=${_BACKEND_IMAGE}:${SHORT_SHA}
      - --wait
    waitFor: ['push-backend']

  # ── Step 5: Deploy backend service ───────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - letter-archive-backend
      - --region=${_REGION}
      - --image=${_BACKEND_IMAGE}:${SHORT_SHA}
    waitFor: ['run-migrations']

  # ── Step 6: Deploy frontend service ──────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - letter-archive-frontend
      - --region=${_REGION}
      - --image=${_FRONTEND_IMAGE}:${SHORT_SHA}
    waitFor: ['push-frontend']

  # ── Step 7: Deploy worker ────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - worker-pools
      - update
      - letter-archive-worker
      - --region=${_REGION}
      - --image=${_BACKEND_IMAGE}:${SHORT_SHA}
    waitFor: ['run-migrations']

images:
  - '${_BACKEND_IMAGE}:${SHORT_SHA}'
  - '${_BACKEND_IMAGE}:latest'
  - '${_FRONTEND_IMAGE}:${SHORT_SHA}'
  - '${_FRONTEND_IMAGE}:latest'

timeout: 1200s

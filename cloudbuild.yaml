# Cloud Build pipeline for Letter Archive
# Builds backend + frontend images, runs migrations, deploys to Cloud Run.
#
# Trigger: push to main branch (or manual)
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)

substitutions:
  _TAG: latest
  _REGION: us-east1
  _CLOUD_SQL_INSTANCE: letter-archive-db
  _ARCHIVE_BUCKET: letter-archive-485110-archive
  _DOMAIN: voicesthatremain.com
  _SERVICE_ACCOUNT: 'letter-archive-runner@${PROJECT_ID}.iam.gserviceaccount.com'
  _BACKEND_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/letter-archive/backend'
  _FRONTEND_IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/letter-archive/frontend'

options:
  dynamic_substitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Build images (parallel) ────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -t
      - '${_BACKEND_IMAGE}:${_TAG}'
      - -t
      - '${_BACKEND_IMAGE}:latest'
      - -f
      - backend/Dockerfile
      - backend
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -t
      - '${_FRONTEND_IMAGE}:${_TAG}'
      - -t
      - '${_FRONTEND_IMAGE}:latest'
      - --build-arg
      - 'VITE_API_URL=https://api.${_DOMAIN}'
      - --build-arg
      - 'VITE_SITE_URL=https://${_DOMAIN}'
      - -f
      - frontend/Dockerfile
      - frontend
    waitFor: ['-']

  # ── Push images (parallel after builds) ─────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args: ['push', '--all-tags', '${_BACKEND_IMAGE}']
    waitFor: ['build-backend']

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args: ['push', '--all-tags', '${_FRONTEND_IMAGE}']
    waitFor: ['build-frontend']

  # ── Prepare deploy manifests (substitute placeholders) ──────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: prepare-manifests
    entrypoint: bash
    args:
      - -c
      - |
        for f in deploy/cloudrun/*.yaml; do
          sed -i \
            -e "s|SERVICE_ACCOUNT_EMAIL|${_SERVICE_ACCOUNT}|g" \
            -e "s|CLOUD_SQL_INSTANCE|${_CLOUD_SQL_INSTANCE}|g" \
            -e "s|ARCHIVE_BUCKET|${_ARCHIVE_BUCKET}|g" \
            -e "s|BACKEND_IMAGE|${_BACKEND_IMAGE}:${_TAG}|g" \
            -e "s|FRONTEND_IMAGE|${_FRONTEND_IMAGE}:${_TAG}|g" \
            -e "s|PROJECT_NUMBER|${PROJECT_ID}|g" \
            -e "s|PROJECT_ID|${PROJECT_ID}|g" \
            -e "s|YOUR_DOMAIN|${_DOMAIN}|g" \
            -e "s|REGION|${_REGION}|g" \
            "$$f"
        done
    waitFor: ['-']

  # ── Deploy + run migrations ─────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-migrate-job
    entrypoint: gcloud
    args:
      - run
      - jobs
      - replace
      - deploy/cloudrun/backend-migrate-job.yaml
      - --region=${_REGION}
    waitFor: ['push-backend', 'prepare-manifests']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - letter-archive-migrate
      - --region=${_REGION}
      - --wait
    waitFor: ['deploy-migrate-job']

  # ── Deploy backend service ──────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services replace deploy/cloudrun/backend-service.yaml \
          --region=${_REGION}
        gcloud run services add-iam-policy-binding letter-archive-backend \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet || \
        echo "WARNING: Could not set IAM policy — set public access manually"
    waitFor: ['run-migrations', 'prepare-manifests']

  # ── Deploy frontend service ─────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services replace deploy/cloudrun/frontend-service.yaml \
          --region=${_REGION}
        gcloud run services add-iam-policy-binding letter-archive-frontend \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet || \
        echo "WARNING: Could not set IAM policy — set public access manually"
    waitFor: ['push-frontend', 'prepare-manifests']

  # ── Deploy worker pool ──────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run worker-pools replace deploy/cloudrun/backend-workerpool.yaml \
          --region=${_REGION} 2>/dev/null || \
        gcloud run worker-pools update letter-archive-worker \
          --region=${_REGION} \
          --image=${_BACKEND_IMAGE}:${_TAG}
    waitFor: ['run-migrations', 'prepare-manifests']

images:
  - '${_BACKEND_IMAGE}:${_TAG}'
  - '${_BACKEND_IMAGE}:latest'
  - '${_FRONTEND_IMAGE}:${_TAG}'
  - '${_FRONTEND_IMAGE}:latest'

timeout: 1200s

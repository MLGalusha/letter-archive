apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: letter-archive-backfill-dimensions
  namespace: __PROJECT_ID__
  labels:
    cloud.googleapis.com/location: __REGION__
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: __PROJECT_ID__:__REGION__:__CLOUD_SQL_INSTANCE__
        run.googleapis.com/execution-environment: gen2
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          maxRetries: 0
          timeoutSeconds: 900
          serviceAccountName: __BACKFILL_SERVICE_ACCOUNT__
          containers:
            - image: __BACKEND_IMAGE__
              command:
                - node
              args:
                - dist/cli/backfill-dimensions.js
              env:
                - name: NODE_ENV
                  value: production
                - name: STORAGE_DIR
                  value: /mnt/archive
                - name: LOG_TO_FILES
                  value: "false"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: database-url-backfill
                      key: latest
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: archive-storage
                  mountPath: /mnt/archive
          volumes:
            - name: archive-storage
              csi:
                driver: gcsfuse.run.googleapis.com
                readOnly: true
                volumeAttributes:
                  bucketName: __ARCHIVE_BUCKET__

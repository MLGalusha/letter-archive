apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: letter-archive-backend
  namespace: PROJECT_NUMBER
  labels:
    cloud.googleapis.com/location: REGION
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: SERVICE_ACCOUNT_EMAIL
      containers:
        - image: BACKEND_IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: https://YOUR_DOMAIN
            - name: CORS_ORIGINS
              value: https://YOUR_DOMAIN
            - name: STORAGE_DIR
              value: /mnt/archive
            - name: LOG_TO_FILES
              value: "false"
            - name: ALLOW_ADMIN_SETUP
              value: "false"
            - name: SEED_DEV_ADMIN
              value: "false"
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            # Secrets from Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 10
            periodSeconds: 3
          volumeMounts:
            - name: archive-storage
              mountPath: /mnt/archive
      volumes:
        - name: archive-storage
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: false
            volumeAttributes:
              bucketName: ARCHIVE_BUCKET
  traffic:
    - percent: 100
      latestRevision: true

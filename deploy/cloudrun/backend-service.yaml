apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: letter-archive-backend
  namespace: __PROJECT_ID__
  labels:
    cloud.googleapis.com/location: __REGION__
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cloudsql-instances: __PROJECT_ID__:__REGION__:__CLOUD_SQL_INSTANCE__
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: __BACKEND_SERVICE_ACCOUNT__
      containers:
        - image: __BACKEND_IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: https://__DOMAIN__
            - name: CORS_ORIGINS
              value: https://__DOMAIN__
            - name: STORAGE_DIR
              value: /mnt/archive
            - name: LOG_TO_FILES
              value: "false"
            - name: ALLOW_ADMIN_SETUP
              value: "false"
            - name: SEED_DEV_ADMIN
              value: "false"
            - name: RELEASE_SHA
              value: __RELEASE_SHA__
            - name: GOOGLE_CLOUD_PROJECT
              value: __PROJECT_ID__
            - name: CLOUD_RUN_REGION
              value: __REGION__
            - name: CLOUD_RUN_WORKER_JOB_NAME
              value: letter-archive-worker
            # Secrets from Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url-api
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 10
            periodSeconds: 3
          volumeMounts:
            - name: archive-storage
              mountPath: /mnt/archive
      volumes:
        - name: archive-storage
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: false
            volumeAttributes:
              bucketName: __ARCHIVE_BUCKET__
  traffic:
    - percent: 100
      latestRevision: true

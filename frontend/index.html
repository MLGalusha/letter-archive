<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Letter Archive</title>
    <meta name="description" content="A digital archive preserving personal letters and historical correspondence." />
    <link rel="canonical" href="https://letterarchive.org" />

    <!-- Open Graph defaults (overridden per-page by react-helmet-async) -->
    <meta property="og:title" content="Letter Archive" />
    <meta property="og:description" content="A digital archive preserving personal letters and historical correspondence." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Letter Archive" />
    <meta property="og:url" content="https://letterarchive.org" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Letter Archive" />
    <meta name="twitter:description" content="A digital archive preserving personal letters and historical correspondence." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Sitemap — proxy to backend which generates it dynamically from the DB
    location = /sitemap.xml {
        proxy_pass https://letter-archive-backend-pt4d3xglpa-ue.a.run.app/sitemap.xml;
        proxy_set_header Host letter-archive-backend-pt4d3xglpa-ue.a.run.app;
        proxy_ssl_server_name on;
        include /etc/nginx/security-headers.conf;
    }

    # Robots.txt — serve static file directly
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback — don't cache the shell
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Disable caching for service worker / manifest if added later
    location ~* \.(json|webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;
}
